/* Hàm vẽ sơ đồ */
function loadDiagram(id) {
  document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${id}`).classList.add('active');
  activeId = id;

  const data = diagrams[id];
  document.getElementById('title').innerText = data.title;

  const canvas = document.getElementById('canvas');
  canvas.innerHTML = ''; // Xóa sạch canvas cũ

  // Chiều cao làn lớn đảm bảo không bao giờ bị cắt nét hay tràn viền
  const laneHeight = 145;
  const headerWidth = 50;
  const startX = 20;
  const poolWidth = 1600;
  const totalLanes = data.lanes.length;
  const poolHeight = totalLanes * laneHeight;

  canvas.setAttribute('viewBox', `0 0 ${poolWidth + 100} ${poolHeight + 100}`);
  canvas.setAttribute('width', (poolWidth + 100).toString());
  canvas.setAttribute('height', (poolHeight + 100).toString());

  // Thêm Defs cho marker mũi tên
  const defs = document.createElementNS(NS, 'defs');
  
  // Arrowhead cho nét thường
  const m1 = document.createElementNS(NS, 'marker');
  m1.setAttribute('id', 'arr');
  m1.setAttribute('markerWidth', '10');
  m1.setAttribute('markerHeight', '7');
  m1.setAttribute('refX', '9');
  m1.setAttribute('refY', '3.5');
  m1.setAttribute('orient', 'auto');
  const p1 = document.createElementNS(NS, 'polygon');
  p1.setAttribute('points', '0 0, 10 3.5, 0 7');
  p1.setAttribute('fill', '#333');
  m1.appendChild(p1);
  defs.appendChild(m1);
  canvas.appendChild(defs);

  // 1. Vẽ Pool lớn
  const poolRect = document.createElementNS(NS, 'rect');
  poolRect.setAttribute('x', startX.toString());
  poolRect.setAttribute('y', '30');
  poolRect.setAttribute('width', poolWidth.toString());
  poolRect.setAttribute('height', poolHeight.toString());
  poolRect.setAttribute('fill', 'none');
  poolRect.setAttribute('stroke', '#333');
  poolRect.setAttribute('stroke-width', '2');
  canvas.appendChild(poolRect);

  // 2. Vẽ các Lane
  data.lanes.forEach((laneName, index) => {
    const y = 30 + index * laneHeight;

    // Đường ngăn giữa các Lane
    if (index > 0) {
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', startX.toString());
      line.setAttribute('y1', y.toString());
      line.setAttribute('x2', (startX + poolWidth).toString());
      line.setAttribute('y2', y.toString());
      line.setAttribute('stroke', '#444');
      line.setAttribute('stroke-width', '1.5');
      canvas.appendChild(line);
    }

    // Tiêu đề của Lane (Nằm dọc ở cột bên trái)
    const textGroup = document.createElementNS(NS, 'g');
    textGroup.setAttribute('transform', `translate(${startX + 22}, ${y + laneHeight / 2}) rotate(-90)`);
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('font-size', '11px');
    text.setAttribute('font-weight', 'bold');
    text.setAttribute('fill', '#333');
    text.textContent = laneName;
    textGroup.appendChild(text);
    canvas.appendChild(textGroup);
  });

  // Đường phân cách dọc của header cột trái
  const vertLine = document.createElementNS(NS, 'line');
  vertLine.setAttribute('x1', (startX + headerWidth).toString());
  vertLine.setAttribute('y1', '30');
  vertLine.setAttribute('x2', (startX + headerWidth).toString());
  vertLine.setAttribute('y2', (30 + poolHeight).toString());
  vertLine.setAttribute('stroke', '#333');
  vertLine.setAttribute('stroke-width', '2');
  canvas.appendChild(vertLine);

  // 3. Định vị tọa độ các node và lưu trữ để vẽ flow
  const nodeCoords = {};

  data.nodes.forEach(node => {
    const laneY = 30 + node.lane * laneHeight;
    const offset = node.y || 0; 
    const nodeY = laneY + (laneHeight / 2) + offset;
    const nodeX = startX + headerWidth + node.x;

    nodeCoords[node.id] = { x: nodeX, y: nodeY, type: node.type };

    if (node.type === 'start') {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', nodeX.toString());
      c.setAttribute('cy', nodeY.toString());
      c.setAttribute('r', '17');
      c.setAttribute('fill', '#e6f4ea');
      c.setAttribute('stroke', '#137333');
      c.setAttribute('stroke-width', '2.5');
      canvas.appendChild(c);

      const labelOffset = node.labelPos === 'top' ? -34 : 34;
      drawTextLines(nodeX, nodeY + labelOffset, node.name, 9.5, 'middle', '#333');
    } 
    else if (node.type === 'end') {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', nodeX.toString());
      c.setAttribute('cy', nodeY.toString());
      c.setAttribute('r', '17');
      c.setAttribute('fill', '#fce8e6');
      c.setAttribute('stroke', '#c5221f');
      c.setAttribute('stroke-width', '4');
      canvas.appendChild(c);

      const labelOffset = node.labelPos === 'top' ? -34 : 34;
      drawTextLines(nodeX, nodeY + labelOffset, node.name, 9.5, 'middle', '#333');
    } 
    else if (node.type === 'gateway') {
      const size = 23;
      const poly = document.createElementNS(NS, 'polygon');
      const pts = `${nodeX},${nodeY - size} ${nodeX + size},${nodeY} ${nodeX},${nodeY + size} ${nodeX - size},${nodeY}`;
      poly.setAttribute('points', pts);
      poly.setAttribute('fill', '#fef7e0');
      poly.setAttribute('stroke', '#b06000');
      poly.setAttribute('stroke-width', '2.5');
      canvas.appendChild(poly);

      const sign = document.createElementNS(NS, 'text');
      sign.setAttribute('x', nodeX.toString());
      sign.setAttribute('y', (nodeY + 3.5).toString());
      sign.setAttribute('text-anchor', 'middle');
      sign.setAttribute('font-size', '14px');
      sign.setAttribute('font-weight', 'bold');
      sign.setAttribute('fill', '#b06000');
      sign.textContent = '×';
      canvas.appendChild(sign);

      // Hệ thống tính toán nhãn rẽ nhánh theo các hướng top/bottom/left/right linh hoạt
      let labelX = nodeX;
      let labelY = nodeY;
      let labelAnchor = 'middle';

      if (node.labelPos === 'top') {
        labelY = nodeY - 34;
      } else if (node.labelPos === 'bottom') {
        labelY = nodeY + 34;
      } else if (node.labelPos === 'left') {
        labelX = nodeX - 32;
        labelY = nodeY - 12;
        labelAnchor = 'end';
      } else if (node.labelPos === 'right') {
        labelX = nodeX + 32;
        labelY = nodeY - 12;
        labelAnchor = 'start';
      } else {
        labelY = nodeY - 34; // Mặc định trên
      }
      drawTextLines(labelX, labelY, node.name, 9.5, labelAnchor, '#333');
    } 
    else if (node.type === 'task') {
      const w = 135;
      const h = 56;
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', (nodeX - w / 2).toString());
      r.setAttribute('y', (nodeY - h / 2).toString());
      r.setAttribute('width', w.toString());
      r.setAttribute('height', h.toString());
      r.setAttribute('rx', '4');
      r.setAttribute('ry', '4');
      r.setAttribute('fill', '#f5f7fa');
      r.setAttribute('stroke', '#3a5a6a');
      r.setAttribute('stroke-width', '1.5');
      canvas.appendChild(r);

      drawTextLines(nodeX, nodeY, node.name, 10, 'middle', '#333');
    }
  });

  // 4. Vẽ các luồng điều hướng (Sequence Flows)
  data.flows.forEach(flow => {
    const fromNode = nodeCoords[flow.from];
    const toNode = nodeCoords[flow.to];

    if (!fromNode || !toNode) return;

    let pathD = '';
    let labelX = 0, labelY = 0;
    let textAnchor = 'middle';

    const wFrom = fromNode.type === 'task' ? 135 : (fromNode.type === 'gateway' ? 46 : 34);
    const hFrom = fromNode.type === 'task' ? 56 : (fromNode.type === 'gateway' ? 46 : 34);
    const wTo = toNode.type === 'task' ? 135 : (toNode.type === 'gateway' ? 46 : 34);
    const hTo = toNode.type === 'task' ? 56 : (toNode.type === 'gateway' ? 46 : 34);

    // Hỗ trợ vẽ đường thẳng đứng khi hai node cùng trục dọc (khoảng cách X < 15)
    if (Math.abs(fromNode.x - toNode.x) < 15) {
      const startXVal = fromNode.x;
      const endXVal = toNode.x;
      
      const isUp = toNode.y < fromNode.y;
      const startYVal = fromNode.y + (isUp ? -hFrom/2 : hFrom/2);
      const endYVal = toNode.y + (isUp ? hTo/2 : -hTo/2);
      
      pathD = `M ${startXVal} ${startYVal} L ${endXVal} ${endYVal}`;
      labelX = startXVal + 8;
      labelY = (startYVal + endYVal) / 2;
      textAnchor = 'start';
    } 
    else if (flow.elbow) {
      if (toNode.x < fromNode.x) {
        // Luồng đi ngược từ phải qua trái (Ví dụ: vòng lặp sửa lỗi)
        const startXVal = fromNode.x - wFrom / 2;
        const startYVal = fromNode.y;
        
        const endXVal = toNode.x + wTo / 2;
        const endYVal = toNode.y;

        // Bẻ góc tại khoảng trống bên phải của Node đích để tránh đè lên các node ở giữa
        const midX = endXVal + 12.5; 
        
        pathD = `M ${startXVal} ${startYVal} L ${midX} ${startYVal} L ${midX} ${endYVal} L ${endXVal} ${endYVal}`;
        
        labelX = midX + 6;
        labelY = (startYVal + endYVal) / 2;
        textAnchor = 'start';
      } else {
        // Luồng đi xuôi từ trái qua phải (Mặc định)
        const startXVal = fromNode.x + wFrom / 2;
        const startYVal = fromNode.y;
        
        const endXVal = toNode.x - wTo / 2;
        const endYVal = toNode.y;

        const midX = startXVal + 25; 
        
        pathD = `M ${startXVal} ${startYVal} L ${midX} ${startYVal} L ${midX} ${endYVal} L ${endXVal} ${endYVal}`;
        
        labelX = midX + 6;
        labelY = (startYVal + endYVal) / 2;
        textAnchor = 'start';
      }
    } 
    else {
      if (toNode.x < fromNode.x) {
        const startXVal = fromNode.x - wFrom / 2;
        const endXVal = toNode.x + wTo / 2;
        pathD = `M ${startXVal} ${fromNode.y} L ${endXVal} ${toNode.y}`;

        labelX = (startXVal + endXVal) / 2;
        labelY = fromNode.y - 7;
        textAnchor = 'middle';
      } else {
        const startXVal = fromNode.x + wFrom / 2;
        const endXVal = toNode.x - wTo / 2;
        pathD = `M ${startXVal} ${fromNode.y} L ${endXVal} ${toNode.y}`;

        labelX = (startXVal + endXVal) / 2;
        labelY = fromNode.y - 7;
        textAnchor = 'middle';
      }
    }

    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', pathD);
    path.setAttribute('stroke', '#333');
    path.setAttribute('stroke-width', '1.3');
    path.setAttribute('fill', 'none');
    path.setAttribute('marker-end', 'url(#arr)');
    canvas.appendChild(path);

    if (flow.label) {
      const text = document.createElementNS(NS, 'text');
      text.setAttribute('x', labelX.toString());
      text.setAttribute('y', labelY.toString());
      text.setAttribute('font-size', '9.5px');
      text.setAttribute('fill', '#555');
      text.setAttribute('font-weight', 'bold');
      text.setAttribute('text-anchor', textAnchor);
      text.textContent = flow.label;
      canvas.appendChild(text);
    }
  });
}

function drawTextLines(x, y, str, size, anchor, color) {
  if (!str) return;
  const lines = str.split('\n');
  const lh = size * 1.25;
  const startY = y - ((lines.length - 1) * lh) / 2;
  const text = document.createElementNS(NS, 'text');
  text.setAttribute('font-size', size.toString());
  text.setAttribute('text-anchor', anchor);
  text.setAttribute('fill', color);
  
  lines.forEach((line, i) => {
    const tspan = document.createElementNS(NS, 'tspan');
    tspan.setAttribute('x', x.toString());
    tspan.setAttribute('y', (startY + i * lh).toString());
    tspan.setAttribute('dominant-baseline', 'middle');
    tspan.textContent = line;
    text.appendChild(tspan);
  });
  document.getElementById('canvas').appendChild(text);
}

function removeVietnameseTones(str) {
  str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g,"a"); 
  str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g,"e"); 
  str = str.replace(/ì|í|ị|ỉ|ĩ/g,"i"); 
  str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g,"o"); 
  str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g,"u"); 
  str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g,"y"); 
  str = str.replace(/đ/g,"d");
  str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
  str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
  str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
  str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
  str = str.replace(/Ù|Ú|Ụ|Ủ|U|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
  str = str.replace(/Ỳ|Ý|Y|Ỷ|Ỹ/g, "Y");
  str = str.replace(/Đ/g, "D");
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, "");
}

function getExportFileName() {
  const data = diagrams[activeId];
  let cleanTitle = data.title;
  if (cleanTitle.includes('—')) {
    cleanTitle = cleanTitle.split('—')[1].trim();
  } else if (cleanTitle.includes('-')) {
    cleanTitle = cleanTitle.split('-')[1].trim();
  }
  
  // Loại bỏ dấu tiếng Việt để tránh lỗi tải file UUID của Chrome
  cleanTitle = removeVietnameseTones(cleanTitle);
  // Loại bỏ các ký tự đặc biệt không hợp lệ trên Windows
  cleanTitle = cleanTitle.replace(/[^a-zA-Z0-9\s()_-]/g, ' ');
  cleanTitle = cleanTitle.replace(/\s+/g, ' ').trim();
  
  return `BPMN_${cleanTitle}`;
}

/* Các hàm xử lý xuất dữ liệu ảnh */
function downloadSVG() {
  const svgEl = document.getElementById('canvas').cloneNode(true);
  const serializer = new XMLSerializer();
  const source = serializer.serializeToString(svgEl);
  const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${getExportFileName()}.svg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadPNG() {
  const svgEl = document.getElementById('canvas');
  const serializer = new XMLSerializer();
  const source = serializer.serializeToString(svgEl);
  
  const img = new Image();
  const svgBlob = new Blob([source], {type: 'image/svg+xml;charset=utf-8'});
  const svgUrl = URL.createObjectURL(svgBlob);
  img.src = svgUrl;
  
  img.onload = function() {
    const canvas = document.createElement('canvas');
    const bbox = svgEl.viewBox.baseVal;
    canvas.width = bbox.width * 2;
    canvas.height = bbox.height * 2;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(svgUrl);
    
    // Sử dụng toDataURL thay cho toBlob để Chrome nhận diện chính xác thuộc tính download của thẻ <a>
    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `${getExportFileName()}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
}
