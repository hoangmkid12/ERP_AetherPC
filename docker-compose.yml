services:
# 1. Database Service (PostgreSQL) — TẠM TẮT VÌ ĐANG DÙNG TRỰC TIẾP POSTGRESQL TRÊN RAILWAY
  # db:
  #   image: postgres:15-alpine
  #   container_name: kltn_postgres
  #   restart: always
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: kltn_erp
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #     - ./backups/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # 2. Redis Service — cần cho hàng đợi xử lý đơn hàng (orderQueue.js/
  # orderWorker.js dùng ioredis qua REDIS_URL). Trước đây không có service này
  # trong compose stack nên `npm run queue:worker` không thể chạy khi deploy.
  redis:
    image: redis:7-alpine
    container_name: kltn_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend Service (Express Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kltn_backend
    restart: always
    ports:
      - "5000:5000"
    # Tải biến môi trường từ tệp tin cục bộ .env để lấy GEMINI_API_KEY, v.v.
    env_file:
      - ./backend/.env
    # Kết nối trực tiếp tới PostgreSQL trên Railway
    environment:
      - DATABASE_URL=postgresql://postgres:IvbTmfcNYDKhQzmByEELqONGmayojNiv@altaria.proxy.rlwy.net:48710/railway
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Ánh xạ thư mục cào dữ liệu để chạy seed script
      - ./scraper:/scraper
    depends_on:
      redis:
        condition: service_healthy

  # 4. Order Queue Worker — tiến trình xử lý nền riêng biệt (KHÔNG phải bản
  # sao của backend service ở trên): backend/src/app.js không import
  # orderQueue.js nên API chính không phụ thuộc Redis, nhưng bất kỳ đơn hàng
  # nào được đẩy vào hàng đợi (nếu tính năng này được bật) sẽ không có gì xử
  # lý nếu thiếu service này. An toàn để tắt (comment lại) nếu chưa dùng.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kltn_order_worker
    restart: always
    command: npm run queue:worker
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:IvbTmfcNYDKhQzmByEELqONGmayojNiv@altaria.proxy.rlwy.net:48710/railway
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy

  # 3. Frontend Service (Vite React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kltn_frontend
    restart: always
    ports:
      - "3000:3000"
    # frontend/.env hardcodes VITE_API_PROXY_TARGET=http://localhost:5000 for
    # running "npm run dev" outside Docker. Inside the frontend container,
    # "localhost" is the container itself (nothing listens on :5000 there),
    # so override it to the Docker Compose service name — same pattern as
    # the DATABASE_URL override on the backend service below.
    environment:
      - VITE_API_PROXY_TARGET=http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

