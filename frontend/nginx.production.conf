server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Use Google DNS for runtime resolution
  resolver 8.8.8.8 valid=30s ipv6=off;

  # Proxy API requests to backend service
  location /api/ {
    # Using a variable forces nginx to resolve DNS at request time, not startup
    set $backend_url "${BACKEND_URL}";
    proxy_pass $backend_url;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required for proxying to HTTPS upstream (Railway public URL)
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
  }

  # Proxy CSKH chat WebSocket to backend — without this block, requests to
  # /ws/cskh fall through to the SPA fallback below and get served index.html
  # as a plain 200 response instead of ever reaching the backend's `ws`
  # server, so the chat silently never connects.
  location /ws/ {
    set $backend_url "${BACKEND_URL}";
    proxy_pass $backend_url;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # WebSocket connections are long-lived — nginx's 60s default read/send
    # timeout would silently drop an idle chat session.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA fallback — serve index.html for all non-file routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
